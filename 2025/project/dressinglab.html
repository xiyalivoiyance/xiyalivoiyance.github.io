  <a href="../index.html"> <img src="img/cr5.png"  id="ring"> </a>

<script>
var ring = document.getElementById('ring');
    var rotateRing = 0;
    var deg = 0;


ring.addEventListener('mouseenter', () => {
    rotateRing = 1;
    rotate();
  });
  
 ring.addEventListener('mouseleave', () => {
    rotateRing = 0;
  });

  function rotate(){
    if(rotateRing == 1){
        ring.style.transform = 'rotate(' + deg + 'deg)';
        deg += 3;
        console.log(deg);
        requestAnimationFrame(rotate);
    }
  }

  var pagePos = 0;
  window.addEventListener('scroll', () => {
    pagePos = window.scrollY
    if(pagePos >= 1000){
      ring.style.visibility = 'hidden';
    } else{
      ring.style.visibility = 'visible';
    }
});


//banner


    var banner = document.getElementById('banner');
    var close = document.getElementById('close');

 banner.addEventListener('mouseenter', () => {
            banner.style.height = `8vh`;
            close.style.transform = 'rotate(90deg)';
 
  })

   banner.addEventListener('mouseleave', () => {
            banner.style.height = `7.3vh`;
            close.style.transform = 'rotate(0deg)';

  })



 
</script>
