<!DOCTYPE html>

<html>

<head>
<meta charset="UTF-8">
<title>XIYA LI PORTFOLIO</title>
	<title>Xiya Li</title>
	<meta name="author" content="Xiya Li">

<meta name="Description" content="Xiya Li's portfolio website">
</head>

    <style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

a {
            text-decoration: none;
            color: inherit;
        }

body {
  display: flex;
  background-repeat: no-repeat;
  background-size: 100% auto;
  background-position: center;
  background-color: white;
  flex-direction: column;
  align-items: center; 
}

#banner{
background-color: white;
position: fixed; 
width: 100vw;
height:12vh;
box-shadow: 0 4px 7px rgba(0, 0, 0, 0.02);
display: flex;
flex-direction: column;
align-items: center;

}

#l1{
width: 100vw;
height:10vh;
display: flex;
flex-direction: row;
align-items: flex-start;
}

#home{
font-family: 'Jost', sans-serif;
font-weight: 560; 
font-size: 1.1rem;
/* width:7.5vw; */
text-align: right;
margin-top: 5vh;
}

#box1{
width: 85vw;                     
height: 0.5vh;
margin-top: 5vh;
/* display: block; */
}

#close{
  height: 0.4vh;
  margin-top: 6.4vh;
  margin-left: 85vw;
}



h2{
font-family: 'Jost', sans-serif;
font-weight: 450; 
font-size: 0.75rem;

}

#featured{
width:85vw;
margin-top: .2vh;
text-align: right;
display: none; 
}

#ma{
width:85vw;
margin-top:.2vh;
text-align: right;
display: none; 
}

#bfa{
width:85vw;
margin-top: .2vh;
text-align: right;
display: none; 
}

#about{
width:85vw;
margin-top:1vh;
margin-top:1vh;
text-align: right;
display: none; 
}


#gallery{
background-color: white;
margin-top: 20vh; 
width: 85vw;
margin-bottom: 20vh;
display: flex;              
    flex-wrap: wrap;         
    gap: .5vh;


}

.project{
  width:42.3vw;
}

a .project {
    display: block;         
    width: 100%;    
}

h1{
font-family: 'Jost', sans-serif;
font-weight: 450; 
font-size: 1.1rem;

}

    </style>
    
<body>


    
<div id="banner">
  <div id="l1">
    <h1 href="index.html" id="home">XIYA LI</h1>

 <img src="img/close.svg"  id="close">
  </div>

    <a href="index.html" >
   <h2 id="featured">Selected works</h2>
</a>
  
    <a href="2025/index.html" >
   <h2 id="ma">2023 - 2025</h2>
</a>

     <a href="2020/index.html" >
  <h2 id="bfa">2016 - 2020</h2>
</a>
 
    <a href="about.html" >
    <h2 id="about">ABOUT</h2>
</a>

</div>

<div id="gallery">

  <a href="project/p1.html"> <img src="img/p1.png" class="project"> </a>
  <a href="project/p2.html"> <img src="img/p2.png" class="project"> </a>
  <a href="project/p3.html"> <img src="img/p3.png" class="project"> </a>
  <a href="project/p4.html"> <img src="img/p4.png" class="project"> </a>
  <a href="project/p5.html"> <img src="img/p5.png" class="project"> </a>
  <a href="project/p6.html"> <img src="img/p6.png" class="project"> </a>

</div>





<script>


    var banner = document.getElementById('banner');
    var close = document.getElementById('close');
    var feature = document.getElementById('featured');
    var ma = document.getElementById('ma');
    var bfa = document.getElementById('bfa');
    var about = document.getElementById('about');

 banner.addEventListener('mouseenter', () => {
            banner.style.height = `24vh`;
            close.style.transform = 'rotate(90deg)';
                    feature.style.display = 'block';   
            ma.style.display = 'block';    
    bfa.style.display = 'block';
    about.style.display = 'block';
 
  })

   banner.addEventListener('mouseleave', () => {
            banner.style.height = `12vh`;
            close.style.transform = 'rotate(0deg)';
            feature.style.display = 'none';    
            ma.style.display = 'none';      
    bfa.style.display = 'none';
    about.style.display = 'none';

  })

//resize

  const width = window.innerWidth;
  const height = window.innerHeight;

var galleryWidth = document.querySelectorAll('.project');
var home = document.getElementById('home');
var l1 = document.getElementById('l1');
var gallery = document.getElementById('gallery');
// var box1 = document.getElementById('box1');

var h1 = document.querySelectorAll('h1');
var h2 = document.querySelectorAll('h2');


function setProjectWidth() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    console.log("resize");
    
    if (width < height) {
        galleryWidth.forEach(project => {
            project.style.width = '85vw';
               
        });
        // box1.style.width = '60vw';
        l1.style.width = '85vw';
        home.style.removeProperty('width');
        close.style.marginLeft = 'auto';
        gallery.style.gap = '5vh';


         h1.forEach(x => {
            x.style.fontSize = '3rem';
        });

        h2.forEach(x => {
            x.style.fontSize = '2rem';
        });


    } else {
        galleryWidth.forEach(project => {
            project.style.width = '42.3vw';
             
        });
        // box1.style.width = '85vw';
        l1.style.width = '100vw';
        home.style.width = '7.5vw';   
        close.style.marginLeft = '85vw';
      gallery.style.gap = '.5vh';

  h1.forEach(x => {
            x.style.fontSize = '1.1rem';
        });

         h2.forEach(x => {
            x.style.fontSize = '0.75rem';
        });



    }
}


setProjectWidth();

window.addEventListener('resize', setProjectWidth);


</script>

</body>
</html>
